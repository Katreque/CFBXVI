# Dependency update PRs. Every pin in the repo is exact, so these PRs are the only way
# versions move, and CI tests each one before merge. Minor and patch updates are grouped
# per ecosystem to keep the PR count low.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Quartz (vendored, D-010). Majors come with a Quartz upgrade, not on their own.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      quartz:
        update-types: [minor, patch]

  # PWA post-build step and offline tests. katex, d3 and pixi.js replace the CDN URLs
  # Quartz emits (pwa/config.mjs), so they follow Quartz: katex is pinned exactly there,
  # d3 and pixi.js by major.
  - package-ecosystem: npm
    directory: /pwa
    schedule:
      interval: weekly
    ignore:
      - dependency-name: katex
      - dependency-name: d3
        update-types: ["version-update:semver-major"]
      - dependency-name: pixi.js
        update-types: ["version-update:semver-major"]
    groups:
      pwa:
        update-types: [minor, patch]

  # Pipeline. CI runs only the linker tests: a Docling or Pillow update must be checked
  # locally with `pytest pipeline/tests` (extraction never runs in CI, D-002).
  - package-ecosystem: pip
    directory: /pipeline
    schedule:
      interval: weekly
    groups:
      pipeline:
        update-types: [minor, patch]
