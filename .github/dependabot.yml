# Dependency update PRs; CI tests each one before merge. Lockfiles pin every installed
# version, so nothing moves unless one of these PRs moves it. Minor and patch updates are
# grouped to keep the PR count low; each major gets its own PR.
#
# Ignore rules below use `update-types`, which only filters version updates: Dependabot
# security updates still open for every dependency.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]

  # Quartz (vendored, D-010). Its package.json stays untouched (D-011), so only the
  # lockfile moves, within Quartz's own ranges. Majors come with a Quartz upgrade.
  # Plugins are grouped apart: a plugin release can break the D-013 search patches on
  # purpose, and that shouldn't hold up unrelated bumps.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: lockfile-only
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      quartz-plugins:
        patterns: ["@quartz-community/*"]
        update-types: [minor, patch]
      quartz:
        update-types: [minor, patch]

  # PWA post-build step and offline tests. katex, d3 and pixi.js replace the CDN URLs
  # Quartz emits (pwa/config.mjs), so they follow Quartz: katex is pinned exactly there,
  # d3 and pixi.js by major.
  - package-ecosystem: npm
    directory: /pwa
    schedule:
      interval: weekly
    ignore:
      - dependency-name: katex
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: d3
        update-types: ["version-update:semver-major"]
      - dependency-name: pixi.js
        update-types: ["version-update:semver-major"]
    groups:
      pwa:
        update-types: [minor, patch]

  # Pipeline. CI runs only the linker tests: a Docling or Pillow update must be checked
  # locally with `pytest pipeline/tests` (extraction never runs in CI, D-002).
  - package-ecosystem: pip
    directory: /pipeline
    schedule:
      interval: weekly
    groups:
      pipeline:
        update-types: [minor, patch]
