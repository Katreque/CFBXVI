name: Build and deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git history gives Quartz accurate created/modified dates

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            pwa/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix pwa

      - name: Install Quartz plugins
        run: node quartz/bootstrap-cli.mjs plugin install

      - name: Build site
        run: node quartz/bootstrap-cli.mjs build

      - name: Add PWA (vendor assets, manifest, service worker)
        run: npm --prefix pwa run build

      # Chromium is cached per runner image and Playwright version. Its system packages come
      # with the runner image (which ships Chrome): `--with-deps` ran apt, which pulled fonts
      # at ~50 kB/s from the Ubuntu mirror and could take ten minutes.
      - name: Playwright cache key
        id: playwright
        run: |
          version=$(node -p "require('./pwa/package-lock.json').packages['node_modules/@playwright/test']?.version")
          if [ -z "$version" ] || [ "$version" = undefined ]; then
            echo "::error::@playwright/test not found in pwa/package-lock.json"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:?runner image name not set}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.image }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browser
        working-directory: pwa
        run: npx playwright install chromium # no-op on a cache hit

      - name: Offline tests
        working-directory: pwa
        run: npx playwright test

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: pwa/test-results
          retention-days: 7

      - name: Upload site
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  glossary:
    # Linker tests and glossary rules only; extraction (Docling) never runs in CI (D-002).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install linker dependencies
        run: pip install -r pipeline/requirements-linker.txt

      - name: Linker tests
        run: python -m pytest pipeline/tests -q --ignore=pipeline/tests/test_extract.py

      - name: Glossary valid and applied
        run: python pipeline/link.py --check

  deploy:
    # Only master reaches production; manual runs on other branches just build and test.
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: [build, glossary]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
