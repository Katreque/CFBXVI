name: Build and deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # git history gives Quartz accurate created/modified dates

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            pwa/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix pwa

      - name: Install Quartz plugins
        run: node quartz/bootstrap-cli.mjs plugin install

      - name: Build site
        run: node quartz/bootstrap-cli.mjs build

      - name: Add PWA (vendor assets, manifest, service worker)
        run: npm --prefix pwa run build

      - name: Install Playwright browser
        working-directory: pwa
        run: npx playwright install --with-deps chromium

      - name: Offline tests
        working-directory: pwa
        run: npx playwright test

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: pwa/test-results
          retention-days: 7

      - name: Upload site
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  glossary:
    # Linker tests and glossary rules only; extraction (Docling) never runs in CI (D-002).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install linker dependencies
        run: pip install PyYAML==6.0.3 pytest==9.1.1

      - name: Linker tests
        run: python -m pytest pipeline/tests -q --ignore=pipeline/tests/test_extract.py

      - name: Glossary valid and applied
        run: python pipeline/link.py --check

  deploy:
    # Only master reaches production; manual runs on other branches just build and test.
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: [build, glossary]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
